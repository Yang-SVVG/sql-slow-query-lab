name: ci

on:
  push:
  pull_request:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成小规模数据
        run: python bench/gen_data.py --orders 60000 --customers 8000 --force

      - name: 执行计划对照（索引没被用上就失败）
        run: python bench/explain_compare.py

      - name: 跑一次完整实验
        run: python bench/run_bench.py --runs 1

      - name: 单测（结果不变 + 计划确实变快）
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: results/benchmark.md
